kind = "web"
previewPath = "/"
title = "Aurora"
version = "1.0.0"
id = "artifacts/web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 8080

[services.development]
run = 'echo "Aurora dev server is already running via the Start application workflow on port 8080 (shared flat-root app, not a per-artifact process)." && sleep infinity'

# Build: delegate to scripts/build.js (the deployer's cached command) so every
# production build is snapshotted and health-gated (docs/BACKUP_AND_DR.md).
# Heap cap: 4608 MB for the 8 GB deploy builder — must track app growth
# together with the prod-build workflow and the
# NODE_OPTIONS default inside scripts/build.js and scripts/start-prod.sh.
[services.production]
build = [ "bash", "-c", "NODE_OPTIONS=--max-old-space-size=4608 exec bash scripts/replit-node.sh scripts/build.js" ]
run = [ "bash", "-c", "NODE_OPTIONS=--max-old-space-size=4608 PORT=8080 HOST=0.0.0.0 exec bash scripts/start-prod.sh" ]

[services.production.health.startup]
path = "/health"

[services.env]
BASE_PATH = "/"
PORT = "8080"
