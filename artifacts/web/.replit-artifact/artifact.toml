kind = "web"
  previewPath = "/"
  title = "Aurora"
  version = "1.0.0"
  id = "artifacts/web"
  router = "path"

  [[integratedSkills]]
  name = "react-vite"
  version = "1.0.0"

  [[services]]
  name = "web"
  paths = [ "/" ]
  localPort = 8080

  [services.development]
  run = 'echo "Aurora dev server is already running via the Start application workflow on port 8080 (shared flat-root app, not a per-artifact process)." && sleep infinity'

  [services.production]
  build = [ "bash", "-c", "NODE_OPTIONS=--max-old-space-size=3072 exec bash scripts/replit-node.sh node_modules/vite/bin/vite.js build" ]
  run = [ "bash", "-c", "NODE_OPTIONS=--max-old-space-size=3072 exec bash scripts/replit-node.sh .output/server/index.mjs" ]
  healthcheckPath = "/api/health"

  [services.env]
  BASE_PATH = "/"
  