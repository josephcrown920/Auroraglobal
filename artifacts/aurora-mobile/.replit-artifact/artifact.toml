kind = "mobile"
previewPath = "/mobile/"
title = "Aurora Mobile"
version = "1.0.0"
id = "artifacts/aurora-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/mobile/" ]
localPort = 23967

[services.development]
run = "pnpm --filter @workspace/aurora-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aurora-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/aurora-mobile", "run", "serve" ]

[services.env]
PORT = "23967"
BASE_PATH = "/mobile/"
