kind = "web"
previewPath = "/aurora-rollout/"
title = "Aurora Rollout"
version = "1.0.0"
id = "artifacts/aurora-rollout"

[[services]]
name = "web"
paths = [ "/aurora-rollout/" ]
localPort = 25914

[services.development]
run = "bash /home/runner/workspace/artifacts/aurora-rollout/start-dev.sh"

[services.production]
build = [ "npm", "run", "build" ]
serve = "static"
publicDir = "artifacts/aurora-rollout/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25914"
BASE_PATH = "/aurora-rollout/"
