name = "aurora-studio"
description = "Aurora Studio — TanStack Start (React) app served by a Node SSR server."
kind = "web"

[access]
type = "stack"
name = "PNPM_WORKSPACE"

[services.web]
localPort = 8080
paths = ["/"]

[services.web.production]
build = ["bash", "scripts/replit-node.sh", "node_modules/vite/bin/vite.js", "build"]
run = ["bash", "scripts/replit-node.sh", ".output/server/index.mjs"]
