ed support, and per-second billing. Contact sales.\",\"href\":\"/docs/enterprise-pricing\"},{\"title\":\"Enterprise Billing — Dollar-Based\",\"description\":\"Buy HeyGen API capacity in dollars, not credits. Enterprise dollar-based billing lets your team forecast spend across avatars, video agent, translation, and.\",\"hidden\":true,\"href\":\"/docs/enterprise-pricing-dollar-base\",\"hiddenSetByFrontmatter\":true}]},{\"group\":\"Models\",\"pages\":[{\"title\":\"Models\",\"description\":\"Browse every HeyGen avatar rendering engine behind the API - Avatar V, Avatar IV, and Avatar III - and learn how to choose between them.\",\"href\":\"/models\"},{\"title\":\"Avatar V\",\"description\":\"Avatar V is HeyGen's highest-fidelity v3 rendering engine, using cross-reference-driven animation for the most natural motion and lip-sync. Opt-in per look.\",\"href\":\"/avatar-v\"},{\"title\":\"Avatar IV\",\"description\":\"Avatar IV is the default HeyGen v3 rendering engine - the broadest avatar support, arbitrary image animation, motion_prompt, and expressiveness control.\",\"href\":\"/avatar-iv\"},{\"title\":\"Avatar III\",\"description\":\"Avatar III is a HeyGen rendering engine on the v3 API, built around a dedicated photo-to-video pipeline — a higher-quality re-engineered model for photo avatars and video avatars (digital twins and studio avatars).\",\"href\":\"/avatar-iii\"}]},{\"group\":\"Video Generation\",\"pages\":[{\"title\":\"Image to Video\",\"description\":\"Animate any image into video with the HeyGen Image to Video API. Add motion, effects, and avatar-led narration to still images programmatically at scale.\",\"href\":\"/image-to-video\"},{\"title\":\"Digital Twin\",\"description\":\"Generate AI avatar video from a script with the HeyGen API. Pick an avatar, voice, and background; HeyGen handles rendering, captions, and final export.\",\"href\":\"/generate-avatar-video\"},{\"title\":\"Transparent Background Videos\",\"description\":\"Generate avatar videos with a transparent background (alpha channel) using the HeyGen API. Set output_format to webm to get a compositing-ready video with no background.\",\"href\":\"/transparent-background-videos\"},{\"title\":\"Photo Avatar\",\"description\":\"Turn a single photo into a talking AI avatar with the HeyGen Photo Avatar API. Upload an image, attach a script, render a lipsynced video starring that photo.\",\"href\":\"/photo-avatar\"},{\"title\":\"Cinematic Avatar\",\"description\":\"Generate cinematic avatar video from a single prompt with the HeyGen API. Combine up to three avatar looks with reference videos and images — no script or voice required.\",\"href\":\"/cinematic-avatar\"}]},{\"group\":\"Realtime\",\"pages\":[{\"title\":\"Avatar Realtime\",\"sidebarTitle\":\"Avatar Realtime (Broadcast)\",\"description\":\"Stream a HeyGen avatar that speaks in real time. Drive speech from a script, an audio file, or a live text stream at 720p.\",\"href\":\"/avatar-realtime\"},{\"title\":\"Live Avatar\",\"sidebarTitle\":\"Live Avatar (Conversation)\",\"description\":\"Build real-time, conversational avatars with the LiveAvatar API. Full documentation lives at docs.liveavatar.com.\",\"href\":\"/live-avatar\"}]},{\"group\":\"Video Agent\",\"tag\":\"Flagship\",\"pages\":[{\"title\":\"Overview\",\"description\":\"Get the lay of the land on the HeyGen developer platform. See what's available across avatars, video agent, translation, streaming, MCP, and SDKs in one.\",\"href\":\"/docs/overview\"},{\"title\":\"Prompt to Video\",\"description\":\"Create AI avatar videos from a single text prompt with the HeyGen Video Agent API. The agent picks the avatar, voice, and style, then renders in minutes.\",\"href\":\"/docs/video-agent\"},{\"title\":\"Styles \u0026 References\",\"description\":\"Steer HeyGen AI video output with style presets and reference images. Apply cinematic looks, brand colors, and visual consistency across generations.\",\"href\":\"/docs/styles-and-references\"},{\"title\":\"Upload Assets\",\"description\":\"Upload images, audio, and video to HeyGen via the Assets API. Use uploaded assets as backgrounds, voice references, lipsync inputs, or photo avatar sources.\",\"href\":\"/docs/upload-assets\"},{\"title\":\"Interactive Sessions\",\"description\":\"Build realtime avatar conversations with the HeyGen Interactive Avatar API. Stream live video, low-latency speech, and bidirectional audio over LiveKit-backed.\",\"href\":\"/docs/interactive-sessions\"}]},{\"group\":\"Hyperframes\",\"tag\":\"New\",\"pages\":[{\"title\":\"Introduction to Hyperframes\",\"sidebarTitle\":\"Introduction\",\"description\":\"Hyperframes turns HTML compositions into rendered video — a code-driven, deterministic video framework built for agents and developers. Write HTML, render video.\",\"href\":\"/hyperframes-overview\"},{\"title\":\"Hyperframes Cloud Rendering\",\"description\":\"Render programmatic, code-driven video with the HeyGen Hyperframes API. Upload an HTML project bundle, inject runtime variables, and HeyGen renders it to MP4, WebM, or MOV.\",\"href\":\"/hyperframes\"},{\"title\":\"Hyperframes + HeyGen\",\"sidebarTitle\":\"Hyperframes + HeyGen\",\"description\":\"Combine a HeyGen avatar video with background music, sound effects, and Hyperframes graphics into one finished, produced video — all through the HeyGen API.\",\"href\":\"/hyperframes-heygen\"}]},{\"group\":\"Video Translation\",\"pages\":[{\"title\":\"Video Translation -  Speed\",\"description\":\"Translate videos into 175+ languages with the HeyGen Video Translation API. Preserves the speaker's voice, applies lipsync to the target language, and exports.\",\"href\":\"/docs/video-translate\"},{\"title\":\"Video Translation - Precision\",\"description\":\"Use HeyGen Video Translation in precision mode for verbatim transcripts, terminology control, and proofread SRT inputs.\",\"href\":\"/docs/video-translation-precision\"},{\"title\":\"Bulk Video Translation\",\"description\":\"Submit large batches of videos to the HeyGen Bulk Video Translation API. Translate hundreds of videos in parallel into multiple target languages from a single.\",\"href\":\"/docs/bulk-video-translation\"}]},{\"group\":\"Avatars\",\"tag\":\"\",\"pages\":[{\"title\":\"Create Avatar\",\"description\":\"Create a HeyGen avatar from video footage, a single photo, or a text prompt. Covers all three creation types, generating new looks for an existing avatar, the consent flow, and how to render videos with your trained avatar.\",\"href\":\"/docs/create-avatar\"},{\"title\":\"Avatar Consent\",\"description\":\"How HeyGen verifies that the person in a digital twin agreed to be cloned — the three levels of consent access, and the API flow for collecting it.\",\"href\":\"/docs/avatar-consent\"},{\"title\":\"Avatar Groups\",\"description\":\"Generate AI avatar videos via the HeyGen API. Choose from 500+ stock avatars or train custom digital twins. Includes avatar looks, voices, and instant.\",\"href\":\"/docs/avatars\"},{\"title\":\"Avatar Looks\",\"description\":\"Browse and select avatar looks (outfits, poses, hair styles) for any HeyGen avatar group via the Avatar Looks API.\",\"href\":\"/docs/avatar-looks\"}]},{\"group\":\"Voices\",\"pages\":[{\"title\":\"Voices\",\"description\":\"Browse, search, and use voices on HeyGen via the Voices API. Covers stock voices, custom voice design, voice cloning, and how to pair voices with avatars.\",\"href\":\"/docs/voices/overview\"},{\"title\":\"Browse Voices\",\"description\":\"List and filter HeyGen voices by language, gender, accent, and age. Returns voice IDs ready to use in video generation requests across all HeyGen video APIs.\",\"href\":\"/docs/voices/search-voices\"},{\"title\":\"Design a Voice\",\"description\":\"Generate a brand new custom voice from a natural-language description using the HeyGen Design a Voice API. No source audio needed; describe the voice you want.\",\"href\":\"/docs/voices/design-voices\"},{\"title\":\"Text to Speech\",\"description\":\"Convert text to audio using any HeyGen voice via the Text-to-Speech API. Useful for previewing voices, generating standalone audio, or pre-rendering speech for.\",\"href\":\"/docs/voices/speech\"}]},{\"group\":\"Tools\",\"pages\":[{\"title\":\"Background music\",\"description\":\"Search HeyGen's background-music catalog with natural language and get ready-to-use, pre-signed audio URLs for your videos via the HeyGen API.\",\"href\":\"/background-music\"},{\"title\":\"Sound effects\",\"description\":\"Search HeyGen's sound-effects catalog with natural language and get ready-to-use, pre-signed audio URLs for your videos via the HeyGen API.\",\"href\":\"/sound-effects\"},{\"title\":\"AI clipping\",\"description\":\"Turn a long-form video into short, ready-to-share highlight clips with the HeyGen AI Clipping API — let the model pick the best moments, or cut exact timestamps you supply.\",\"href\":\"/ai-clipping\"}]},{\"group\":\"Lipsync\",\"tag\":\"New\",\"pages\":[{\"title\":\"Lipsync - Speed\",\"description\":\"Run the HeyGen Lipsync API in speed mode for rapid lipsync drafts. Ideal for previewing edits, batch processing, and iterating on content before final render.\",\"href\":\"/lipsync-speed\"},{\"title\":\"Lipsync - Precision\",\"description\":\"Run the HeyGen Lipsync API in precision mode for frame-accurate mouth movements on long-form video. Best for cinematic content where fidelity matters.\",\"href\":\"/lipsync-precision\"}]},{\"group\":\"Webhook\",\"pages\":[{\"title\":\"Webhooks\",\"description\":\"Receive HeyGen API webhook events when videos finish rendering, translations complete, or errors occur. Includes endpoint setup, signature verification, and.\",\"href\":\"/docs/webhooks\"},{\"title\":\"Webhook Events\",\"description\":\"Reference every HeyGen webhook event type with full payload schemas. Includes video.completed, video.failed, translation.completed, with example JSON.\",\"href\":\"/docs/webhook-events\"}]},{\"group\":\"Assets\",\"pages\":[{\"title\":\"Assets\",\"description\":\"Upload, list, and manage images, audio, and video files via the HeyGen Assets API. Reference uploaded assets in any avatar video, translation, or lipsync.\",\"href\":\"/assets\"}]},{\"group\":\"Integrations\",\"pages\":[{\"title\":\"Slack Integration\",\"description\":\"Connect HeyGen to Slack for video render notifications, agent triggers, and team-level activity feeds. Setup takes a few minutes with no code required.\",\"href\":\"/docs/slack\"}]},{\"group\":\"Legacy APIs\",\"tag\":\"Legacy\",\"pages\":[{\"title\":\"Studio API\",\"description\":\"Embed the HeyGen Studio video editor in your application via the Studio API. Let your users record, edit, and render avatar videos inside your product.\",\"href\":\"/studio-api\"},{\"title\":\"Template API\",\"description\":\"Create reusable video templates with the HeyGen Template API. Define avatar, voice, layout, and branding once, then generate variations at scale via API.\",\"href\":\"/template-api\"}]},{\"group\":\"Limits\",\"pages\":[{\"title\":\"Usage Limits\",\"description\":\"See HeyGen API rate limits by endpoint and plan tier. Includes concurrent video render quotas, request-per-minute caps, and how to request a quota increase.\",\"href\":\"/docs/usage-limits\"},{\"title\":\"Error Codes\",\"description\":\"Error codes, HTTP status codes, and troubleshooting for the HeyGen API\",\"href\":\"/docs/error-codes\"}]},{\"group\":\"Socials\",\"pages\":[{\"title\":\"Discord\",\"description\":\"Join the HeyGen developer Discord for API help, feature announcements, and community recipes. Talk to the API team and other developers building on HeyGen.\",\"tag\":\"Social \",\"href\":\"/docs/discord\"}]},{\"group\":\"For Agents\",\"pages\":[{\"title\":\"For AI Agents\",\"description\":\"Agent-first onboarding for AI coding agents — detect auth before writing code, follow the MCP → CLI → raw API ladder, and go from a blank session to a finished video.\",\"href\":\"/docs/for-ai-agents\"},{\"title\":\"Stripe Projects\",\"description\":\"Provision a HeyGen API key directly from the Stripe CLI. Stripe handles billing and identity; HeyGen creates the account, applies your budget for API credit, and returns the key — no sign-up screen, no card handed to the agent.\",\"href\":\"/docs/stripe-projects\"}]}]},{\"tab\":\"API Reference\",\"groups\":[{\"group\":\"Video Agent\",\"pages\":[{\"title\":\"List Video Agent Sessions\",\"description\":\"Returns a paginated list of video agent sessions for the authenticated user, sorted newest-first.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"List video agent sessions\",\"openapi\":\"/openapi/external-api.json get /v3/video-agents\",\"href\":\"/reference/list-video-agent-sessions\",\"autogeneratedByOpenApi\":true},{\"title\":\"Create Video Agent Session\",\"description\":\"One-shot video generation from a prompt — agent handles scripting, avatar selection, scene composition, and rendering. Supports generate (fire-and-forget) and chat (multi-turn) modes.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Create video agent session\",\"openapi\":\"/openapi/external-api.json post /v3/video-agents\",\"href\":\"/reference/create-video-agent-session\",\"autogeneratedByOpenApi\":true},{\"title\":\"List Video Agent Styles\",\"description\":\"Returns curated visual style templates available for Video Agent sessions. Each style controls scene composition, pacing, and aesthetics. Supports tag filtering (e.g. 'cinematic', 'retro-tech').\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"List video agent styles\",\"openapi\":\"/openapi/external-api.json get /v3/video-agents/styles\",\"href\":\"/reference/list-video-agent-styles\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get Video Agent Session\",\"description\":\"Returns the current status, progress, video_id, and recent chat messages for a session.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Get video agent session\",\"openapi\":\"/opena atedByOpenApi\":true},{\"title\":\"Get Avatar Group\",\"description\":\"Returns details for a specific avatar group including name, gender, preview URLs, looks count, and training status.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Get avatar group\",\"openapi\":\"/openapi/external-api.json get /v3/avatars/{group_id}\",\"href\":\"/reference/get-avatar-group\",\"autogeneratedByOpenApi\":true},{\"title\":\"Delete Avatar Group\",\"description\":\"Permanently deletes an avatar group and all its associated looks. Cannot delete public or community groups.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Delete avatar group\",\"openapi\":\"/openapi/external-api.json delete /v3/avatars/{group_id}\",\"href\":\"/reference/delete-avatar-group\",\"autogeneratedByOpenApi\":true},{\"title\":\"Create Avatar Consent\",\"description\":\"Initiates the consent flow for an avatar group and returns a URL for the user to complete approval in their browser. Required before a private avatar can be used for video generation.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Create avatar consent\",\"openapi\":\"/openapi/external-api.json post /v3/avatars/{group_id}/consent\",\"href\":\"/reference/create-avatar-consent\",\"autogeneratedByOpenApi\":true},{\"title\":\"List Avatar Looks\",\"description\":\"Returns a paginated list of avatar looks (outfits, poses, styles). Filterable by group_id, avatar_type, and ownership. The look id is the avatar_id to pass when creating a video.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"List avatar looks\",\"openapi\":\"/openapi/external-api.json get /v3/avatars/looks\",\"href\":\"/reference/list-avatar-looks\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get Avatar Look\",\"description\":\"Returns details for a specific avatar look including supported engines, preferred orientation, preview URLs, and training status.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Get avatar look\",\"openapi\":\"/openapi/external-api.json get /v3/avatars/looks/{look_id}\",\"href\":\"/reference/get-avatar-look\",\"autogeneratedByOpenApi\":true},{\"title\":\"Delete Avatar Look\",\"description\":\"Deletes an avatar look and its backing resource. Supported types: photo_avatar, digital_twin, and kit-based looks. Studio avatar (model_index) types cannot be deleted via the API. Deleting the last look in a group does not auto-delete the parent group.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Delete avatar look\",\"openapi\":\"/openapi/external-api.json delete /v3/avatars/looks/{look_id}\",\"href\":\"/reference/delete-avatar-look\",\"autogeneratedByOpenApi\":true},{\"title\":\"Update Avatar Look\",\"description\":\"Updates the display name of an avatar look. Only supported for photo avatar and digital twin look types.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Update avatar look\",\"openapi\":\"/openapi/external-api.json patch /v3/avatars/looks/{look_id}\",\"href\":\"/reference/update-avatar-look\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Avatar Realtime\",\"pages\":[{\"title\":\"Create Avatar Realtime Session\",\"description\":\"Start a low-latency streaming avatar session and return a `stream_id`. Three modes, selected by the `type` discriminator: `tts` (speak a fixed script), `audio` (drive lip-sync from a pre-existing audio asset), and `text_stream` (seed with initial text, then append more text deltas over time via POST /v3/avatar-realtime/{stream_id}/text — e.g. as an upstream LLM streams tokens). Poll GET /v3/avatar-realtime/{stream_id} for the session status and HLS playback URL.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Create avatar realtime session\",\"openapi\":\"/openapi/external-api.json post /v3/avatar-realtime\",\"href\":\"/reference/create-avatar-realtime-session\",\"autogeneratedByOpenApi\":true},{\"title\":\"Get Avatar Realtime Session\",\"description\":\"Get the status of a streaming avatar session. `status` is on _id}/text\",\"href\":\"/reference/append-avatar-realtime-text\",\"autogeneratedByOpenApi\":true},{\"title\":\"Cancel Avatar Realtime Session\",\"description\":\"Cancel a running streaming session. Idempotent: `cancelled` is true when this request initiated the cancellation, or false when the session was already terminal (completed, failed, or previously cancelled).\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Cancel avatar realtime session\",\"openapi\":\"/openapi/external-api.json post /v3/avatar-realtime/{stream_id}/cancel\",\"href\":\"/reference/cancel-avatar-realtime-session\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Audio\",\"pages\":[{\"title\":\"Search audio (music or sound effects)\",\"description\":\"Semantically search the audio catalog by natural-language description — set type=music (the default) for background music (e.g. 'upbeat lofi hip-hop', 'tense cinematic riser') or type=sound_effects for SFX (e.g. 'whoosh for a scene change', 'cash register cha-ching'). Returns tracks ranked by similarity, each with a pre-signed download URL, plus cursor-based pagination.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Search audio music or sound effects\",\"openapi\":\"/openapi/external-api.json get /v3/audio/sounds\",\"href\":\"/reference/search-audio-music-or-sound-effects\",\"autogeneratedByOpenApi\":true}]},{\"group\":\"Voices\",\"pages\":[{\"title\":\"Generate Speech\",\"description\":\"Synthesize speech audio from text using a specified voice. The voice must support the starfish engine — use GET /v3/voices?engine=starfish to find compatible voices. Supports plain text and SSML. Speed range: 0.5–2.0x. Returns a URL to the generated audio file along with duration and optional word-level timestamps.\",\"deprecated\":null,\"version\":null,\"sidebarTitle\":\"Generate speech\",\"openapi\":\"/openapi/external-api.json post /v3/voices/speech\",\"href\":\"/reference/generate-speech\",\"autogeneratedByOpenApi\":true},{\"title\":\"List V
