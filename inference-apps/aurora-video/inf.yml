name: aurora-video
display_name: Aurora Video Generator
description: >
  Text-to-video and image-to-video with camera motion control.
  Pass a prompt for t2v, or prompt + image_urls[0] for i2v.
  Optional: camera_movement (push_in | pull_out | orbit_left | orbit_right |
  pan_left | pan_right | tilt_up | tilt_down | zoom_in | zoom_out | static),
  duration_seconds (1–10, default 5), fps (8|16|24, default 16),
  width (default 832), height (default 480), seed (-1 = random).

resources:
  gpu: A100
  gpu_count: 1

runtime:
  python: "3.11"

env:
  HF_HOME: /workspace/.cache/huggingface
  TORCH_HOME: /workspace/.cache/torch
