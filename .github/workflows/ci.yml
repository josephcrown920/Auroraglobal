name: Aurora quality gate

on:
  pull_request:
    branches: [main, Main]
  push:
    branches: [main, Main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pin npm CLI
        run: npm install --global npm@11.19.1 --no-audit --no-fund
      # The committed lockfile currently contains Replit's internal package
      # firewall URLs. Generate dependencies directly from package.json until
      # the lockfile is regenerated against the public npm registry.
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Generate TanStack route types
        run: npx --yes @tanstack/router-cli generate
      - name: Repair untyped search reducers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              "src/routes/edit.lazy.tsx": [("search: (prev) => ({ ...prev, job: jId })", "search: { ...search, job: jId }")],
              "src/routes/spin.lazy.tsx": [("search: (prev) => ({ ...prev, jobId: id, prompt: undefined })", "search: { ...search, jobId: id, prompt: undefined }")],
              "src/routes/templates.lazy.tsx": [
                  ("search: (prev) => ({ ...prev, category: cat ?? undefined })", "search: { ...search, category: cat ?? undefined }"),
                  ("search: (prev) => ({ ...prev, open: id })", "search: { ...search, open: id }"),
                  ("search: (prev) => ({ ...prev, open: undefined })", "search: { ...search, open: undefined }"),
              ],
              "src/routes/video-editor.lazy.tsx": [("search: (prev) => ({ ...prev, session: id })", "search: { ...search, session: id }")],
          }
          for filename, pairs in replacements.items():
              p = Path(filename)
              text = p.read_text()
              for old, new in pairs:
                  text = text.replace(old, new)
              p.write_text(text)
          PY
          if ! git diff --quiet -- src/routes/edit.lazy.tsx src/routes/spin.lazy.tsx src/routes/templates.lazy.tsx src/routes/video-editor.lazy.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/edit.lazy.tsx src/routes/spin.lazy.tsx src/routes/templates.lazy.tsx src/routes/video-editor.lazy.tsx
            git diff --cached --check
            git commit -m "fix: type TanStack search navigation updates"
            git push origin HEAD:Main
          fi
      - name: Production gate
        run: npm run lint && npm run typecheck && node scripts/test-isolated.mjs && bash scripts/check-migrations.sh && node scripts/ci/audit-worker-entry.mjs && npm run build

  e2e:
    name: Playwright end-to-end
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Pin npm CLI
        run: npm install --global npm@11.19.1 --no-audit --no-fund
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Generate TanStack route types
        run: npx --yes @tanstack/router-cli generate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        run: npm run test:e2e
