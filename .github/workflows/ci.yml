name: Aurora quality gate

on:
  pull_request:
    branches: [main, Main]
  push:
    branches: [main, Main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Pin npm CLI
        run: npm install --global npm@11.19.1 --no-audit --no-fund
      # The committed lockfile currently contains Replit's internal package
      # firewall URLs. Generate dependencies directly from package.json until
      # the lockfile is regenerated against the public npm registry.
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      # Single source of truth: lint/typecheck plus isolated test processes,
      # followed by the migration, worker-boundary, and production-build gates.
      # Test files are isolated because Bun mock.module() and process globals
      # are process-wide and several provider suites intentionally stub them.
      - name: Production gate
        run: npm run lint && npm run typecheck && node scripts/test-isolated.mjs && bash scripts/check-migrations.sh && node scripts/ci/audit-worker-entry.mjs && npm run build

  e2e:
    name: Playwright end-to-end
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"
      - name: Pin npm CLI
        run: npm install --global npm@11.19.1 --no-audit --no-fund
      # See the quality job above: avoid Replit-only lockfile URLs in CI.
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright suite
        run: npm run test:e2e
