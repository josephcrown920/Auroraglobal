name: Aurora known-good certification

on:
  workflow_run:
    workflows: ["Aurora quality gate"]
    types: [completed]

permissions:
  contents: write

jobs:
  certify:
    name: Promote certified release
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'Main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Record certified commit
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.payload.workflow_run.head_sha;
            const shortSha = sha.slice(0, 12);
            const immutableTag = `production-certified-${shortSha}`;
            const movingTag = 'production-known-good';

            async function ensureRef(tag, force = false) {
              const ref = `refs/tags/${tag}`;
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                await github.rest.git.updateRef({ owner, repo, ref: `tags/${tag}`, sha, force });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({ owner, repo, ref, sha });
              }
            }

            // Immutable audit marker for this certified build.
            await ensureRef(immutableTag, false);
            // Mutable pointer used by deployment/rollback tooling.
            await ensureRef(movingTag, true);

            core.summary
              .addHeading('Aurora production-certified release')
              .addTable([
                [{data: 'Field', header: true}, {data: 'Value', header: true}],
                ['Certified SHA', sha],
                ['Immutable tag', immutableTag],
                ['Known-good pointer', movingTag],
              ])
              .write();
