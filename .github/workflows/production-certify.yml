name: Aurora production certification

on:
  workflow_run:
    workflows: ["Aurora quality gate"]
    types: [completed]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to certify (defaults to Main HEAD)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: aurora-production-certification
  cancel-in-progress: true

env:
  PRODUCTION_URL: https://auroraperformancestudio.com
  CERTIFIED_TAG: production-certified

jobs:
  certify:
    name: Production smoke + certification
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'Main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve candidate commit
        id: candidate
        env:
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA:-${EVENT_SHA}}"
          if [ -z "$SHA" ]; then SHA="$(git ls-remote origin refs/heads/Main | cut -f1)"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Wait for production deployment
        env:
          SHA: ${{ steps.candidate.outputs.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for $PRODUCTION_URL to serve the candidate deployment."
          for attempt in $(seq 1 30); do
            status="$(curl -L -sS -o /tmp/aurora.html -w '%{http_code}' --max-time 15 "$PRODUCTION_URL/")" || status="000"
            if [ "$status" = "200" ]; then
              echo "Production returned HTTP 200 on attempt $attempt."
              break
            fi
            echo "Attempt $attempt: HTTP $status; waiting 10s..."
            sleep 10
          done
          test -s /tmp/aurora.html
          test "$(wc -c < /tmp/aurora.html)" -gt 500
          grep -qi "Aurora" /tmp/aurora.html

      - name: Browser smoke test
        env:
          PRODUCTION_URL: ${{ env.PRODUCTION_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({headless: true});
          const page = await browser.newPage();
          const errors = [];
          page.on('pageerror', (err) => errors.push(err.message));
          const response = await page.goto(process.env.PRODUCTION_URL, {waitUntil: 'domcontentloaded', timeout: 30000});
          if (!response || !response.ok()) throw new Error(`Production navigation failed: ${response?.status() ?? 'no response'}`);
          await page.waitForTimeout(2500);
          const bodyText = (await page.locator('body').innerText()).trim();
          if (bodyText.length < 20) throw new Error('Production page rendered an unexpectedly empty body.');
          if (errors.length) throw new Error(`Production browser errors: ${errors.slice(0, 5).join(' | ')}`);
          console.log(`Production smoke passed: ${bodyText.length} body characters.`);
          await browser.close();
          NODE

      - name: Promote candidate to known-good
        env:
          CANDIDATE_SHA: ${{ steps.candidate.outputs.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin Main --tags
          MAIN_SHA="$(git rev-parse origin/Main)"
          if [ "$MAIN_SHA" != "$CANDIDATE_SHA" ]; then
            echo "Main moved from $CANDIDATE_SHA to $MAIN_SHA; refusing to certify a stale candidate."
            exit 1
          fi
          git tag -f "$CERTIFIED_TAG" "$CANDIDATE_SHA"
          git push origin "refs/tags/$CERTIFIED_TAG" --force
          echo "Known-good release: $CANDIDATE_SHA"

  rollback:
    name: Automatic rollback on production smoke failure
    needs: certify
    if: >-
      always() &&
      needs.certify.result == 'failure' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'Main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Roll back Main to last certified release
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init rollback
          cd rollback
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin Main --tags
          if ! git rev-parse --verify "refs/tags/$CERTIFIED_TAG" >/dev/null 2>&1; then
            echo "No known-good production tag exists; refusing automatic rollback."
            exit 1
          fi
          CERTIFIED_SHA="$(git rev-list -n 1 "$CERTIFIED_TAG")"
          MAIN_SHA="$(git rev-parse origin/Main)"
          if [ "$MAIN_SHA" != "$CANDIDATE_SHA" ]; then
            echo "Main moved after certification attempt; refusing to overwrite newer work."
            exit 1
          fi
          if [ "$CERTIFIED_SHA" = "$MAIN_SHA" ]; then
            echo "Main is already at the known-good release."
            exit 0
          fi
          echo "Rolling Main from $MAIN_SHA back to certified $CERTIFIED_SHA"
          git push --force-with-lease=refs/heads/Main:$MAIN_SHA origin "refs/tags/$CERTIFIED_TAG:refs/heads/Main"
