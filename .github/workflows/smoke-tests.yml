name: Public smoke tests

on:
  pull_request:
    branches: [Main]
  push:
    branches: [Main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This is intentionally limited to the public, no-secret smoke suite. The
  # quality gate workflow owns the full validation suite for trusted changes.
  smoke:
    name: Public browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public smoke suite
        run: npm run test:e2e:smoke
